[package]
name = "fumola_wasm"
version = "0.0.29"
authors = ["Matthew Hammer", "Ryan Vandersmith"]
edition = "2021"
license = "Apache-2.0"
description = "WebAssembly bindings for the Fumola interpreter"
repository = "https://github.com/Adapton/fumola.rs"
keywords = ["wasm", "fumola", "adapton"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fumola_semantics = { path = "../fumola_semantics" }
fumola_syntax = { path = "../fumola_syntax" }
fumola_parser = { path = "../fumola_parser" }
line-col = "0.2.1"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]
